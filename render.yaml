services:
  - type: web
    name: nta-pulse
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: DEMO_ADMIN_PASSWORD
        value: "Admin@2026!"
      - key: DEMO_TEACHER_PASSWORD
        value: "Teacher@2026!"
      - key: DEMO_STUDENT_PASSWORD
        value: "Student@2026!"
